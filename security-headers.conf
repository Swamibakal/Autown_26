# Security headers, sent with every page and file (included in each location
# block of nginx.conf.template, because nginx does not inherit add_header
# into a location that sets its own headers).

# Always use HTTPS for one year after the first visit
add_header Strict-Transport-Security "max-age=31536000" always;
# Don't let other sites show this site inside a frame (clickjacking)
add_header X-Frame-Options "DENY" always;
# Browsers must not guess file types
add_header X-Content-Type-Options "nosniff" always;
# Only send the site's address (not full page paths) to other sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The site never needs camera, microphone, location etc.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Content-Security-Policy in REPORT-ONLY mode: nothing is blocked; any
# violation only shows as a warning in the browser console (F12). Once the
# console shows no warnings, rename the header to Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
